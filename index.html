<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Huella UEP Móvil</title>
    <style>
        :root {
            --polar-blue: #1A368F;
            --polar-light: #F4F7FB;
            --polar-accent: #00B4D8;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--polar-light);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-container {
            text-align: center;
            max-width: 600px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--polar-blue);
            font-size: 26px;
            margin-bottom: 5px;
            margin-top: 0;
        }
        p.subtitle {
            color: #555;
            font-size: 15px;
            line-height: 1.4;
            margin-top: 5px;
        }
        .search-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 2px solid #E0E7FF;
            border-radius: 8px;
            outline: none;
            color: var(--polar-blue);
            font-weight: bold;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus { border-color: var(--polar-accent); }
        
        #cardsContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .hero-card {
            background: white;
            border-top: 6px solid var(--polar-blue);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 18px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #e74c3c; }
        
        .strategy-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .loc-title {
            color: var(--polar-blue);
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 10px;
            padding: 0 15px;
        }
        .loc-modality {
            display: inline-block;
            background: #E0E7FF;
            color: var(--polar-blue);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .funnel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .funnel-step {
            border-radius: 6px;
            padding: 12px 10px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .step-1 { background-color: #1c1a65; width: 100%; } 
        .step-2 { background-color: #2766c5; width: 85%; }  
        .step-3 { background-color: #4dc2e6; width: 70%; color: #fff;} 

        .f-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.95;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .f-value {
            font-size: 24px;
            font-weight: 900;
        }
        .f-sub {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
        }
        
        .sat-box {
            margin-top: 15px;
            background: #FFFAF0;
            border: 1px solid #FFE082;
            color: #D48806;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .sat-val {
            font-size: 18px;
            font-weight: 900;
        }

        .cta-footer {
            margin-top: 30px;
            color: #666;
            font-style: italic;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

        var selectorEl = document.getElementById('locSelector');
        Object.keys(dataLocalidades).sort().forEach(function(loc) {
            var option = document.createElement('option');
            option.value = loc;
            option.textContent = loc;
            selectorEl.appendChild(option);
        });

        window.animateValue = function(id, start, end, duration, decimals) {
            var obj = document.getElementById(id);
            if(!obj) return;
            var startTimestamp = null;
            var step = function(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                var progress = Math.min((timestamp - startTimestamp) / duration, 1);
                var currentVal = progress * (end - start) + start;
                obj.innerHTML = currentVal.toFixed(decimals).replace('.', ',');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toFixed(decimals).replace('.', ',');
                }
            };
            window.requestAnimationFrame(step);
        };

        window.removeCard = function(locName) {
            selectedLocs = selectedLocs.filter(function(l) { return l !== locName; });
            var cardId = "card-" + locName.replace(/\s+/g, '-');
            var cardEl = document.getElementById(cardId);
            if(cardEl) {
                cardEl.remove();
            }
        };

        window.addCard = function(locName) {
            if(!locName) return;
            if(selectedLocs.includes(locName)) {
                document.getElementById('locSelector').value = "";
                return;
            }
            selectedLocs.push(locName);
            if(selectedLocs.length > 3) {
                var oldest = selectedLocs.shift();
                removeCard(oldest);
                selectedLocs.push(locName);
            }
            var data = dataLocalidades[locName];
            var cardIdBase = locName.replace(/\s+/g, '-');
            var cardId = "card-" + cardIdBase;
            var satDisplay = (data.sat === 0 || isNaN(data.sat)) ? "N/A" : data.sat.toFixed(2).replace('.', ',');

            var cardHTML = `
                <div class="hero-card" id="${cardId}">
                    <button class="close-btn" onclick="removeCard('${locName}')">✖</button>
                    <div class="strategy-label">Objetivo: Ampliación de la Biblioteca UEP</div>
                    <h2 class="loc-title">${locName}</h2>
                    <div class="loc-modality">Modalidad: ${data.mod}</div>
                    
                    <div class="funnel-container">
                        <div class="funnel-step step-1">
                            <div class="f-title">Personas Atendidas</div>
                            <div class="f-value" id="lbl-asis-${cardIdBase}">0</div>
                            <div class="f-sub">(<span id="lbl-cob-${cardIdBase}">0</span>% de tu localidad)</div>
                        </div>
                        <div class="funnel-step step-2">
                            <div class="f-title">% Usuarios Activos Biblioteca UEP</div>
                            <div class="f-value"><span id="lbl-pct-${cardIdBase}">0</span>%</div>
                        </div>
                        <div class="funnel-step step-3">
                            <div class="f-title">Promedio de horas de uso de la Biblioteca<br>UEP por usuario al mes</div>
                            <div class="f-value" id="lbl-hrs-${cardIdBase}">0</div>
                        </div>
                    </div>

                    <div class="sat-box">
                        ⭐ Satisfacción de la Experiencia: <span class="sat-val"><span id="lbl-sat-${cardIdBase}">0</span> / 5</span>
                    </div>
                </div>
            `;
            
            document.getElementById('cardsContainer').insertAdjacentHTML('beforeend', cardHTML);
            animateValue(`lbl-asis-${cardIdBase}`, 0, data.asis, 800, 0);
            animateValue(`lbl-cob-${cardIdBase}`, 0, data.pct_cob, 900, 1);
            animateValue(`lbl-pct-${cardIdBase}`, 0, data.pct_activos, 1000, 1);
            animateValue(`lbl-hrs-${cardIdBase}`, 0, data.hrs, 1200, 2);
            if (satDisplay !== "N/A") {
                animateValue(`lbl-sat-${cardIdBase}`, 0, data.sat, 1500, 2);
            } else {
                document.getElementById(`lbl-sat-${cardIdBase}`).innerText = "N/A";
            }
            document.getElementById('locSelector').value = "";
        };
